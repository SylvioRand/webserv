<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Page introuvable</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#0b1220;
      --accent1:#7c3aed; /* violet */
      --accent2:#06b6d4; /* cyan */
      --glass: rgba(255,255,255,0.06);
      --muted: rgba(255,255,255,0.6);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent 10%),
                  radial-gradient(800px 400px at 90% 90%, rgba(6,182,212,0.08), transparent 10%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color: #fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .card{
      width:100%;
      max-width:980px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:20px;
      padding:36px;
      box-shadow: 0 8px 40px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(6px) saturate(1.05);
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:28px;
      align-items:center;
    }

    .left{
      padding-left:8px;
    }

    h1{
      font-size:84px;
      line-height:0.9;
      margin:0 0 8px 0;
      font-weight:900;
      letter-spacing:-4px;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(90deg,var(--accent1),var(--accent2));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    p.lead{
      margin:0 0 18px 0;
      color:var(--muted);
      font-size:16px;
      max-width:56ch;
    }

    .actions{display:flex;gap:12px;align-items:center;margin-top:8px}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;font-weight:600}
    .btn-primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:white;box-shadow:0 6px 18px rgba(124,58,237,0.18);}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.06);}

    .right{
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:220px;
    }

    /* stylized paper/planet */
    .planet{
      width:260px;height:260px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
      background: conic-gradient(from 120deg at 50% 50%, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      box-shadow: 0 12px 40px rgba(2,6,23,0.6), inset 0 -12px 40px rgba(6,182,212,0.04);
      border:1px solid rgba(255,255,255,0.03);
      overflow:hidden;
      transform: rotate(-12deg);
    }

    .planet .ring{
      position:absolute;width:380px;height:30px;border-radius:9999px;top:110px;left: -60px;transform: rotate(-20deg);
      background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(6,182,212,0.12));
      filter: blur(6px);
      opacity:0.9;
    }

    .planet .code{
      font-family: 'JetBrains Mono', monospace;
      font-size:14px;color:rgba(255,255,255,0.86);opacity:0.95;line-height:1.1;text-align:center;padding:18px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      transform: rotate(12deg);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }

    /* small floating lights */
    .orb{position:absolute;width:12px;height:12px;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,0.6);opacity:0.95}
    .orb.one{top:18px;right:26px;background:var(--accent1);animation:float 6s ease-in-out infinite}
    .orb.two{bottom:30px;left:40px;background:var(--accent2);width:8px;height:8px;animation:float 5s ease-in-out infinite}

    @keyframes float{
      0%{transform:translateY(0) translateX(0)}
      50%{transform:translateY(-12px) translateX(6px)}
      100%{transform:translateY(0) translateX(0)}
    }

    /* responsive */
    @media (max-width:880px){
      .card{grid-template-columns:1fr;max-width:720px;padding:24px}
      h1{font-size:64px}
      .right{order:-1;margin-bottom:6px}
      .planet{width:200px;height:200px}
    }

    footer{margin-top:18px;color:rgba(255,255,255,0.36);font-size:13px}

    /* subtle animated background grid */
    .grid-bg{
      pointer-events:none;position:absolute;inset:0;mix-blend-mode:overlay;opacity:0.04;background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size:40px 40px,40px 40px;
      transform:translateZ(0);
    }

  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <main class="card" role="main" aria-labelledby="title">
    <section class="left">
      <h1 id="title">404</h1>
      <p class="lead">Oups — la page que vous cherchez est introuvable. Elle a peut‑être été déplacée, renommée, ou n'a jamais existé.</p>

      <div class="actions" role="group">
        <button class="btn btn-primary" onclick="goHome()" aria-label="Retour à l'accueil">🏠 Retour à l'accueil</button>
        <button class="btn btn-ghost" onclick="goBack()" aria-label="Retour en arrière">← Retour</button>
        <a class="btn btn-ghost" href="#report" onclick="report()">⚑ Signaler</a>
      </div>

      <footer>
        <div>Si tu veux, réessaie en vérifiant l'URL ou contacte le support.</div>
      </footer>
    </section>

    <aside class="right" aria-hidden="true">
      <div class="planet" role="img" aria-label="Illustration modern 404">
        <div class="ring" aria-hidden="true"></div>
        <div class="code">// Not found
const path = '/your/page'
if (!exists(path)) {
  throw new Error('404 - Not here');
}</div>
        <div class="orb one"></div>
        <div class="orb two"></div>
      </div>
    </aside>
  </main>

  <script>
    function goHome(){
      // try to return to site root
      if (location && location.origin) location.href = location.origin + '/';
      else location.href = '/';
    }
    function goBack(){
      if (history.length>1) history.back(); else goHome();
    }
    function report(){
      alert('Merci — vous pouvez copier l\'URL et l\'envoyer au support.');
    }

    // small UX touch: keyboard shortcut H for home, B for back
    document.addEventListener('keydown', function(e){
      if (e.key === 'h' || e.key === 'H') goHome();
      if (e.key === 'b' || e.key === 'B') goBack();
    });
  </script>
</body>
</html>
