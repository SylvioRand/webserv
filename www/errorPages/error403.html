<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .error-code {
      font-size: 8rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .message {
      font-size: 1.5rem;
      margin-bottom: 30px;
    }

    .home-btn {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1rem;
      color: #ff6a00;
      background: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background: #ff6a00;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    @media (max-width: 500px) {
      .error-code {
        font-size: 5rem;
      }
      .message {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">403</div>
    <div class="message">Oops! You don’t have permission to access this page.</div>
    <a class="home-btn" href="/">Go Home</a>
  </div>
</body>
</html>
