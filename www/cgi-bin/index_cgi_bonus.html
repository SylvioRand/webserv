<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Cookie Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      color: #333;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #4a90e2;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #357ab8;
    }
    #result {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      width: 80%;
      max-width: 600px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Test du compteur avec Cookie 🍪</h1>
  <button id="check">Vérifier mon compteur</button>
  <div id="result">Clique pour voir combien de fois tu as visité.</div>

  <script>
    document.getElementById("check").addEventListener("click", async () => {
      try {
        let response = await fetch("/cgi-bonus/script.rb", {
          method: "GET",
          credentials: "include"  // <-- important pour garder le cookie
        });
        let text = await response.text();
        document.getElementById("result").innerHTML = text;
      } catch (err) {
        document.getElementById("result").innerText = "Erreur: " + err;
      }
    });
  </script>
</body>
</html>
