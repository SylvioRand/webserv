# this is comment
server {
    listen 0.0.0.0:8081;
    server_name localhost;

    root ./www;
    # index index.html srandria.html;
    error_page 404 /404.html;
    error_page 400 /400.json;
    client_max_body_size 0M;

    location / {
        index index.html;
        client_max_body_size 500000000M;
        methods GET POST;
        autoindex on;
    }

    location /upload {
        methods POST;
        upload_dir ./www/uploads;
    }

    location /delete {
        methods DELETE;
        root ./www/uploads;
    }

    location /redirect {
        return 301 http://example.com;
    }

    location /files {
        root ./www/files;
        autoindex on;
        index index.html;
    }

    location /cgi-bin {
        index index_cgi.html;
        methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        root ./www/cgi-bin;
    }
}

