server { 
    listen 8082;;   ;
    server_name default;
    return 302 /new-page;
    autoindex on;
    autoindex on;
    # root ./www;
    root ./www/;
    client_max_body_size 2M;
    upload_dir ./www/cgi-bin/uploads;

    error_page 400 /400.json;
    error_page 404 /404.html;
    # error_page 404 /404.htmllllllllll; # il va ecrase le 1er valeur

    index index.html srandria.html;

    # index index.html srandria.htmllllllllllll; # il va concatener ici

    location / {
        # path /;
        # root ./www/Mick;
        methods GET;
        index index.html;
        # client_max_body_size 500000000M;
        autoindex off;
        error_page 404 /404.yyyyyyyyyyyyyy;
        error_page 403 /403.html;
        error_page 404 /404.yyyyyyyyyyyyyy;
        error_page 403 /403.html;
    }

    location {
        path /upload;
        methods POST;
        client_max_body_size 0M;
        upload_dir www/uploads;
    }

    location /delete {
        methods DELETE;
        root ./www/uploads;
    }

    location /redirect { 
        return 301 http://localhost:8082/index.html;
    }

    location /files {
        methods GET;
        root ./www/listings;
        autoindex off;
        index files.html sandria.html;
    }

    location /cgi-mandatory {
        index index_cgi.html;
        methods GET POST;
        autoindex on;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        root ./www/;
        upload_dir ./www/cgi-mandatory/uploads
    }

    location /cgi-bonus {
        index index_cgi_bonus.html;
        methods GET;
        cgi_extension .rb;
        cgi_path /home/srandria/Documents/custom/ruby-3.4.5/ruby;
        root ./www/;
    }
}

