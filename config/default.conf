server { 
    listen 8082;
    server_name localhost;
    return 302 /new-page;
    autoindex on;
    root ./www;
    client_max_body_size 2M;
    upload_dir /tmp/uploads;

    error_page 400 /400.json;
    error_page 404 /404.html;
    # error_page 404 /404.htmllllllllll; # il va ecrase le 1er valeur

    index index.html srandria.html;

    # index index.html srandria.htmllllllllllll; # il va concatener ici

    # location / {
    #     # path /;
    #     # root ./www/Mick;
    #     methods GET;
    #     index index.html;
    #     # client_max_body_size 500000000M;
    #     autoindex off;
    #     error_page 404 /404.yyyyyyyyyyyyyy;
    #     error_page 403 /403.html;
    # }

    location /upload {
        methods POST;
        client_max_body_size 500000000M;
        upload_dir ./www/uploads;
    }

    location /delete {
        methods DELETE;
        root ./www/uploads;
    }

    location /redirect { 
        return 301 http://example.com;
    }

    location /files {
        root ./www/files;
        autoindex on;
        index index.html;
    }

    location /cgi-bin {
        index index_cgi.html;
        methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        root ./www/cgi-bin;
    }
}

